{% extends "layouts/dashboard.html" %}
{% load static %}
{% block title %}Hoja de Vida{% endblock %}

{% block content %}
<div class="card mb-6">
  <div class="card__body">
    <div class="input-group">
      <span class="input-group__icon">{% icon "search" 16 %}</span>
      <input class="input" type="search" data-student-search
             placeholder="Buscar estudiante por nombre, documento o codigo...">
    </div>
  </div>
</div>

<div class="grid grid-3" data-student-results>
  <div class="card"><div class="card__body">
    <div class="text-sm text-muted">Escriba al menos 3 caracteres para buscar un estudiante.</div>
  </div></div>
</div>
{% endblock %}

{% block extra_js %}
<script type="module">
  import { $, api, debounce, escapeHtml, icon, initials } from "{% static 'js/app.js' %}";

  const results = $("[data-student-results]");

  const search = debounce(async (term) => {
    if (term.length < 3) return;
    results.innerHTML = '<div class="card"><div class="card__body text-center"><span class="spinner spinner--lg"></span></div></div>';
    try {
      const data = await api.get("/api/students/", { search: term, page_size: 24 });
      const rows = data.results || [];
      results.innerHTML = rows.length
        ? rows.map((student) => `
            <a class="card" href="/estudiantes/${student.id}/hoja-de-vida/" style="text-decoration:none">
              <div class="card__body">
                <div class="row" style="gap:12px">
                  <span class="avatar avatar--lg">${escapeHtml(initials(student.full_name))}</span>
                  <div style="min-width:0">
                    <div class="truncate" style="font-weight:600;color:var(--text-primary)">${escapeHtml(student.display_name)}</div>
                    <div class="text-xs text-muted">${escapeHtml(student.document_number)}</div>
                    <div class="mt-2">
                      <span class="badge badge--brand">${escapeHtml(student.grade_name || "Sin grupo")}</span>
                      <span class="badge badge--neutral">${escapeHtml(student.group_name || "-")}</span>
                    </div>
                  </div>
                </div>
              </div>
            </a>`).join("")
        : `<div class="card"><div class="empty-state">
             <div class="empty-state__icon">${icon("search", 22)}</div>
             <div class="empty-state__title">Sin resultados</div>
             <div class="empty-state__message">No se encontraron estudiantes con ese criterio.</div>
           </div></div>`;
    } catch (error) {
      results.innerHTML = `<div class="alert alert--danger">${escapeHtml(error.message)}</div>`;
    }
  }, 380);

  $("[data-student-search]")?.addEventListener("input", (event) => search(event.target.value.trim()));
</script>
{% endblock %}
