{% extends "authentication/emails/base_email.html" %}
{% block content %}
  <h1 style="font-size:20px;margin:0 0 12px">Confirme su correo electronico</h1>
  <p style="font-size:14px;line-height:1.6;color:#475467;margin:0 0 18px">
    Hola <strong>{{ user.get_full_name }}</strong>, confirme su direccion de correo para completar la
    activacion de su cuenta en {{ app.NAME }}.
  </p>
  <p style="margin:0 0 24px">
    <a href="{{ url }}" style="display:inline-block;background:#10B981;color:#ffffff;text-decoration:none;padding:12px 22px;border-radius:8px;font-size:14px;font-weight:600">
      Verificar correo
    </a>
  </p>
  <p style="font-size:12px;color:#667085;word-break:break-all">{{ url }}</p>
{% endblock %}
